<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
FFVNTGM ITEM FREE FIRE 🔥
</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at top,
      #472300,
      #0b0b0b 42%,
      #020202
    );
}

.container{
  width:100%;
  max-width:550px;

  padding:28px;

  border-radius:25px;

  background:
    rgba(20,20,20,.82);

  border:
    1px solid
    rgba(255,130,0,.3);

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 25px 80px #000,
    0 0 35px
    rgba(255,110,0,.1);
}

.logo{
  width:85px;
  height:85px;

  display:block;
  margin:0 auto 15px;

  object-fit:cover;

  border-radius:22px;

  box-shadow:
    0 0 35px
    rgba(255,130,0,.3);
}

h1{
  text-align:center;
  font-size:25px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:25px;
}

.search{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;

  height:53px;

  padding:0 16px;

  border-radius:14px;

  border:1px solid #444;

  outline:none;

  background:#0d0d0d;

  color:#fff;

  font-size:16px;
}

input:focus{
  border-color:#ff8500;
}

button{
  height:53px;

  padding:0 18px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #ffb000,
      #ff5800
    );

  color:#fff;

  font-weight:bold;

  cursor:pointer;
}

.result{
  display:none;

  margin-top:25px;

  padding:20px;

  border-radius:18px;

  background:#0c0c0c;

  border:1px solid #292929;
}

.item-image{
  width:250px;
  height:250px;

  display:block;

  margin:0 auto 20px;

  object-fit:contain;

  border-radius:18px;

  background:#050505;
}

.row{
  padding:8px 0;

  font-size:14px;

  word-break:break-word;
}

.label{
  color:#888;
}

.value{
  color:#ffae32;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.buttons button{
  flex:1;
}

.secondary{
  background:#222;
  border:1px solid #444;
}

.error{
  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:12px;

  background:#260b0b;

  color:#ff8b8b;
}

.loading{
  display:none;

  text-align:center;

  margin-top:20px;

  color:#ff9d22;
}

.admin{
  display:block;

  margin-top:22px;

  text-align:center;

  color:#666;

  text-decoration:none;

  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:20px;
  }

  .search{
    flex-direction:column;
  }

  button{
    width:100%;
  }

  .buttons{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<div class="container">

<img
  class="logo"
  src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
  alt="FFVNTGM"
>

<h1>
FREE FIRE ITEM 🔥
</h1>

<div class="subtitle">
NHẬN DẠNG ID VẬT PHẨM
</div>

<div class="search">

<input
  id="id"
  type="text"
  inputmode="numeric"
  maxlength="9"
  placeholder="Nhập ID 9 chữ số..."
>

<button onclick="searchItem()">
🔍 NHẬN DẠNG
</button>

</div>

<div id="loading" class="loading">
⏳ ĐANG NHẬN DẠNG...
</div>

<div id="error" class="error"></div>

<div id="result" class="result">

<img
  id="image"
  class="item-image"
  alt="Free Fire Item"
>

<div class="row">
<span class="label">
ID:
</span>

<span
  id="itemId"
  class="value"
></span>
</div>

<div class="row">
<span class="label">
Tên:
</span>

<span
  id="itemName"
  class="value"
></span>
</div>

<div class="row">
<span class="label">
Loại:
</span>

<span
  id="itemType"
  class="value"
></span>
</div>

<div class="row">
<span class="label">
URL ảnh:
</span>

<span
  id="imageUrl"
  class="value"
></span>
</div>

<div class="buttons">

<button onclick="copyImage()">
📋 SAO CHÉP URL ẢNH
</button>

<button
  class="secondary"
  onclick="openImage()"
>
🖼️ MỞ ẢNH
</button>

</div>

</div>

<a
  class="admin"
  href="/api/admin"
>
ADMIN
</a>

</div>

<script>

let currentImage = "";

const input =
  document.getElementById("id");

input.addEventListener(
  "input",
  () => {

    input.value =
      input.value
        .replace(/\D/g,"")
        .slice(0,9);

  }
);

input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      searchItem();
    }

  }
);

function showError(message){

  const error =
    document.getElementById("error");

  error.textContent =
    message;

  error.style.display =
    "block";
}

function hideError(){

  document
    .getElementById("error")
    .style.display =
      "none";
}

async function searchItem(){

  hideError();

  document
    .getElementById("result")
    .style.display =
      "none";

  const id =
    input.value.trim();

  if(!/^\d{9}$/.test(id)){

    showError(
      "❌ ID vật phẩm phải đúng 9 chữ số."
    );

    return;
  }

  document
    .getElementById("loading")
    .style.display =
      "block";

  try{

    const response =
      await fetch(
        `/api/item?id=${id}`
      );

    const data =
      await response.json();

    if(!response.ok ||
       !data.success){

      showError(
        data.message ||
        "Không tìm thấy vật phẩm."
      );

      return;
    }

    currentImage =
      data.item.image;

    document
      .getElementById("image")
      .src =
        data.item.image;

    document
      .getElementById("itemId")
      .textContent =
        data.item.id;

    document
      .getElementById("itemName")
      .textContent =
        data.item.name;

    document
      .getElementById("itemType")
      .textContent =
        data.item.type;

    document
      .getElementById("imageUrl")
      .textContent =
        data.item.image;

    document
      .getElementById("result")
      .style.display =
        "block";

    history.replaceState(
      null,
      "",
      `/id=${id}`
    );

  }catch(error){

    showError(
      "❌ Không thể kết nối API."
    );

  }finally{

    document
      .getElementById("loading")
      .style.display =
        "none";
  }

}

function copyImage(){

  if(!currentImage) return;

  navigator.clipboard
    .writeText(
      location.origin +
      currentImage
    )
    .then(() => {

      alert(
        "✅ Đã sao chép URL ảnh!"
      );

    });

}

function openImage(){

  if(!currentImage) return;

  window.open(
    currentImage,
    "_blank"
  );

}

// ===============================
// TỰ NHẬN ID TỪ /id=123456789
// ===============================

const path =
  location.pathname;

if(path.startsWith("/id=")){

  const id =
    path
      .substring(4)
      .replace(/\D/g,"")
      .slice(0,9);

  if(/^\d{9}$/.test(id)){

    input.value = id;

    setTimeout(
      searchItem,
      150
    );

  }

}

</script>

</body>

</html>
