<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FREE FIRE ITEM ID 🔥</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#3a1600,#090909 45%,#000);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,120,0,.3);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:25px;
  box-shadow:0 0 40px rgba(255,90,0,.15);
}

.logo{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:20px;
  display:block;
  margin:0 auto 15px;
  border:2px solid #ff7a00;
}

h1{
  text-align:center;
  font-size:25px;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aaa;
  font-size:14px;
  margin-bottom:25px;
}

input{
  width:100%;
  height:55px;
  border:none;
  outline:none;
  border-radius:15px;
  padding:0 18px;
  font-size:17px;
  background:#111;
  color:white;
  border:1px solid #333;
  margin-bottom:12px;
}

input:focus{
  border-color:#ff7200;
  box-shadow:0 0 15px rgba(255,114,0,.2);
}

button{
  width:100%;
  height:55px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff9a00,#ff4500);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.result{
  margin-top:22px;
  display:none;
}

.preview{
  width:100%;
  max-height:430px;
  object-fit:contain;
  border-radius:18px;
  background:#080808;
  border:1px solid #333;
  padding:10px;
}

.idbox{
  margin-top:12px;
  background:#111;
  border-radius:12px;
  padding:13px;
  text-align:center;
  color:#bbb;
}

.link{
  display:block;
  margin-top:10px;
  color:#ff8a00;
  word-break:break-all;
  font-size:13px;
  text-decoration:none;
}

.status{
  text-align:center;
  margin-top:15px;
  color:#aaa;
  font-size:14px;
}

.error{
  color:#ff5555;
}

.success{
  color:#57ff8a;
}
</style>
</head>

<body>

<div class="container">

  <img
    class="logo"
    src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
    alt="FFVNTGM"
  >

  <h1>FREE FIRE ITEM ID 🔥</h1>

  <div class="sub">
    Nhập ID vật phẩm Free Fire để xem ảnh
  </div>

  <input
    id="itemId"
    type="text"
    inputmode="numeric"
    maxlength="9"
    placeholder="Nhập ID 9 số..."
  >

  <button onclick="findItem()">
    🔎 HIỆN ẢNH VẬT PHẨM
  </button>

  <div id="status" class="status"></div>

  <div id="result" class="result">

    <img
      id="preview"
      class="preview"
      alt="Free Fire Item"
    >

    <div id="idbox" class="idbox"></div>

    <a
      id="imageLink"
      class="link"
      target="_blank"
    ></a>

  </div>

</div>

<script>

const BASE_URL =
  "https://ffvntgm-item-freefire.vercel.app";

function findItem(){

  const input =
    document.getElementById("itemId");

  const id =
    input.value.trim();

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const preview =
    document.getElementById("preview");

  const idbox =
    document.getElementById("idbox");

  const imageLink =
    document.getElementById("imageLink");

  result.style.display = "none";

  if(!/^\d{9}$/.test(id)){

    status.className = "status error";

    status.textContent =
      "❌ ID phải gồm đúng 9 chữ số.";

    return;
  }

  status.className = "status";

  status.textContent =
    "⏳ Đang kiểm tra vật phẩm...";

  const api =
    `${BASE_URL}/api/item?id=${id}`;

  fetch(api)

    .then(res => res.json())

    .then(data => {

      if(!data.success){

        status.className =
          "status error";

        status.textContent =
          "❌ Không tìm thấy ảnh cho ID này.";

        return;
      }

      preview.src = data.image;

      preview.onload = () => {

        result.style.display = "block";

        status.className =
          "status success";

        status.textContent =
          "✅ Đã tìm thấy vật phẩm.";

        idbox.textContent =
          `ITEM ID: ${id}`;

        imageLink.href =
          data.image;

        imageLink.textContent =
          data.image;
      };

      preview.onerror = () => {

        status.className =
          "status error";

        status.textContent =
          "❌ Không thể tải ảnh.";

      };

    })

    .catch(error => {

      console.error(error);

      status.className =
        "status error";

      status.textContent =
        "❌ API đang lỗi hoặc chưa được cấu hình.";

    });
}

document
  .getElementById("itemId")
  .addEventListener("input", function(){

    this.value =
      this.value.replace(/\D/g,"");

    if(this.value.length === 9){
      findItem();
    }

  });

</script>

</body>
</html>
